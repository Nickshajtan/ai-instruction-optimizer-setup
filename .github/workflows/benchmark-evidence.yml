name: Benchmark evidence

on:
  pull_request:
    paths:
      - "benchmarks/evidence/**"
      - "src/ai_doc/benchmark/**"
      - "src/ai_doc/cli/benchmark.py"
      - ".github/workflows/benchmark-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate benchmark CLI contract
        run: ai-doc benchmark examples/benchmark/example-evidence.json --minimum-runs 1 --fail-on-regression
      - name: Gate committed empirical evidence
        shell: bash
        run: |
          shopt -s nullglob
          evidence=(benchmarks/evidence/*.json)
          if (( ${#evidence[@]} == 0 )); then
            echo "No empirical evidence committed; contract validation only."
            exit 0
          fi
          for file in "${evidence[@]}"; do
            echo "Evaluating ${file}"
            ai-doc benchmark "$file" --fail-on-regression
          done

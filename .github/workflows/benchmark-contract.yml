name: Benchmark contract

on:
  pull_request:
    paths:
      - "examples/benchmark/example-evidence.json"
      - "src/ai_doc/benchmark/**"
      - "src/ai_doc/cli/benchmark.py"
      - ".github/workflows/benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate benchmark CLI contract
        run: ai-doc benchmark examples/benchmark/example-evidence.json --minimum-runs 1 --fail-on-regression

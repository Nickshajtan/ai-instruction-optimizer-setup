name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  executable:
    name: Standalone / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build standalone executable
        run: python -m tools.build executable --mode release
      - name: Smoke test executable
        shell: bash
        run: |
          executable=$(find dist -type f \( -name ai-doc -o -name ai-doc.exe \) | head -n 1)
          test -n "$executable"
          "$executable" --version
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-doc-${{ runner.os }}-${{ runner.arch }}
          path: dist/**
          if-no-files-found: error

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [executable, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag

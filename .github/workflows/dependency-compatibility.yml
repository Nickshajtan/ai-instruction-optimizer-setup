name: Dependency compatibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-declared:
    name: Minimum declared versions / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build minimum dependency constraints
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          requirements = [
              *pyproject["project"]["dependencies"],
              *pyproject["project"]["optional-dependencies"]["dev"],
          ]

          constraints = []
          for requirement in requirements:
              requirement = requirement.split(";", 1)[0].strip()
              match = re.match(r"^([A-Za-z0-9_.-]+)\s*>=\s*([A-Za-z0-9_.!+*-]+)", requirement)
              if not match:
                  raise SystemExit(f"Cannot derive a minimum version from: {requirement}")
              constraints.append(f"{match.group(1)}=={match.group(2)}")

          Path("minimum-constraints.txt").write_text("\n".join(constraints) + "\n", encoding="utf-8")
          PY

      - name: Install minimum declared dependencies
        run: python -m pip install -e ".[dev]" -c minimum-constraints.txt

      - name: Lint
        run: python -m ruff check .

      - name: Quality contracts
        run: python tools/check_quality_contracts.py

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest --cov=ai_doc --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  latest-compatible:
    name: Latest compatible versions / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install latest compatible dependencies
        run: python -m pip install --upgrade -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Quality contracts
        run: python tools/check_quality_contracts.py

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest --cov=ai_doc --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

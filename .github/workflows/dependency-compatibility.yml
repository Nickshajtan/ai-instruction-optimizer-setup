name: Dependency compatibility

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/guides/**"
      - "docs/operations/release-notes.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/guides/**"
      - "docs/operations/release-notes.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-declared:
    name: Minimum declared versions / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependency parser
        run: python -m pip install "packaging>=24.0"

      - name: Build minimum dependency constraints
        run: python -m tools.minimum_constraints pyproject.toml minimum-constraints.txt

      - name: Install minimum declared dependencies
        run: python -m pip install -e ".[dev]" -c minimum-constraints.txt

      - name: Lint
        run: python -m ruff check .

      - name: Quality contracts
        run: python tools/check_quality_contracts.py

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest --cov=ai_doc --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  latest-compatible:
    name: Latest compatible versions / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install latest compatible dependencies
        run: python -m pip install --upgrade -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Quality contracts
        run: python tools/check_quality_contracts.py

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest --cov=ai_doc --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

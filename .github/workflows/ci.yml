name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Wheel smoke
        run: python -m pytest tests/integration/test_packaging_smoke.py::test_wheel_build_install_smoke
        env:
          AI_DOC_RUN_WHEEL_SMOKE: "1"
      - name: CLI smoke
        run: |
          ai-doc --version
          ai-doc doctor examples/basic
          ai-doc check examples/basic

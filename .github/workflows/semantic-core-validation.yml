name: Semantic core pre-PR validation

on:
  push:
    branches:
      - feat/semantic-optimizer-core-v0.3

permissions:
  contents: write

concurrency:
  group: semantic-core-pre-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Format changed semantic-core files
        run: |
          python -m ruff format \
            src/ai_doc/cli/optimize.py \
            src/ai_doc/domain/optimization.py \
            src/ai_doc/evaluators/context.py \
            src/ai_doc/evaluators/deepeval.py \
            src/ai_doc/evaluators/promptfoo.py \
            src/ai_doc/optimizer/evaluation.py \
            src/ai_doc/optimizer/generator.py \
            src/ai_doc/optimizer/invariants.py \
            src/ai_doc/optimizer/recommendation.py \
            src/ai_doc/optimizer/search.py \
            src/ai_doc/reporting/console.py \
            tests/integration/test_search_cli.py \
            tests/integration/test_semantic_search_loop.py \
            tests/unit/test_context_evaluation.py \
            tests/unit/test_evaluators.py \
            tests/unit/test_invariants_optimizer.py
          python -m ruff check --fix \
            src/ai_doc/cli/optimize.py \
            src/ai_doc/domain/optimization.py \
            src/ai_doc/evaluators/context.py \
            src/ai_doc/evaluators/deepeval.py \
            src/ai_doc/evaluators/promptfoo.py \
            src/ai_doc/optimizer/evaluation.py \
            src/ai_doc/optimizer/generator.py \
            src/ai_doc/optimizer/invariants.py \
            src/ai_doc/optimizer/recommendation.py \
            src/ai_doc/optimizer/search.py \
            src/ai_doc/reporting/console.py \
            tests/integration/test_search_cli.py \
            tests/integration/test_semantic_search_loop.py \
            tests/unit/test_context_evaluation.py \
            tests/unit/test_evaluators.py \
            tests/unit/test_invariants_optimizer.py || true
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format semantic core implementation"
            git push
            exit 0
          fi
      - name: Ruff
        run: python -m ruff check .
      - name: Quality contracts
        run: python tools/check_quality_contracts.py
      - name: Mypy
        run: python -m mypy
      - name: Tests
        run: python -m pytest

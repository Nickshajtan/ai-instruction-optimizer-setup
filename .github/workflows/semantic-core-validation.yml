name: Semantic core pre-PR validation

on:
  push:
    branches:
      - feat/semantic-optimizer-core-v0.3

permissions:
  contents: write

concurrency:
  group: semantic-core-pre-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Fix typed invariant collection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/ai_doc/optimizer/search.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from ai_doc.optimizer.invariants import (\n    InvariantImportance,",
              "from ai_doc.optimizer.invariants import (\n    Invariant,\n    InvariantImportance,",
          )
          text = text.replace("        invariants: list,\n", "        invariants: list[Invariant],\n")
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff format src/ai_doc/optimizer/search.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_doc/optimizer/search.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: type semantic invariant collection"
            git push
          fi

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-doc"
version = "0.1.0"
description = "CLI for clarity and FinOps optimization of AI-facing Markdown documentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py>=3.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "pyinstaller>=6.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pylint>=3.2",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
promptfoo = ["promptfoo>=0.1.0"]
deepeval = ["deepeval>=1.0"]
deep = ["promptfoo>=0.1.0", "deepeval>=1.0"]

[project.scripts]
ai-doc = "ai_doc.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_doc"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_doc", "README.md", "ARCHITECTURE.md", "DEFERRED.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "PLR2004", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]
"tests/integration/test_extensions_and_cli.py" = ["ARG002", "ARG005"]
"tests/unit/test_invariants_optimizer.py" = ["ARG002"]

[tool.pylint.main]
# Ruff owns formatting/import style; public API documentation is maintained in docs/
# rather than requiring a docstring on every small protocol, model, and strategy.
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "trailing-newlines",
  "too-few-public-methods",
  "duplicate-code",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
# Ratchet the current architecture instead of accepting Pylint's generic defaults.
# New code may not exceed the largest intentional orchestration objects/functions
# already present; reductions can tighten these limits later.
max-args = 14
max-positional-arguments = 14
max-attributes = 11
max-locals = 37
max-branches = 15
max-statements = 61

[tool.pylint.typecheck]
# Pylint can infer Pydantic model fields as FieldInfo descriptors even though mypy
# and Pydantic resolve the instance attributes correctly at runtime.
ignored-classes = ["FieldInfo"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["ai_doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ai_doc"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

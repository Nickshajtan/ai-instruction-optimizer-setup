[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-doc"
version = "0.1.0"
description = "CLI for clarity and FinOps optimization of AI-facing Markdown documentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py>=3.0",
  "pydantic>=2.8",
  "pyyaml>=6.0.2",
  "typer>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "pyinstaller>=6.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mutmut==3.7.0",
  "ruff>=0.6",
  "pylint>=3.2",
  "mypy>=2.3.1",
  "types-PyYAML>=6.0.12.12",
]
promptfoo = ["promptfoo>=0.1.0"]
deepeval = ["deepeval>=1.0"]
deep = ["promptfoo>=0.1.0", "deepeval>=1.0"]

[project.scripts]
ai-doc = "ai_doc.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_doc"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_doc", "README.md", "ARCHITECTURE.md", "DEFERRED.md", "pyproject.toml"]

[tool.ruff]
line-length = 122
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "PLR2004", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]
"tests/integration/test_extensions_and_cli.py" = ["ARG002", "ARG005"]
"tests/unit/test_invariants_optimizer.py" = ["ARG002"]

[tool.pylint.main]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "trailing-newlines",
  "too-few-public-methods",
  "duplicate-code",
]

[tool.pylint.format]
max-line-length = 122

[tool.pylint.design]
max-args = 14
max-positional-arguments = 14
max-attributes = 11
max-locals = 37
max-branches = 15
max-statements = 61

[tool.pylint.typecheck]
ignored-classes = ["FieldInfo"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["ai_doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ai_doc"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mutmut]
source_paths = ["src/ai_doc"]
only_mutate = [
  "src/ai_doc/optimizer/search.py",
  "src/ai_doc/optimizer/invariants.py",
  "src/ai_doc/optimizer/evaluation.py",
  "src/ai_doc/optimizer/pareto.py",
  "src/ai_doc/optimizer/recommendation.py",
  "src/ai_doc/evaluators/promptfoo.py",
  "src/ai_doc/evaluators/deepeval.py",
  "src/ai_doc/providers/semantic.py",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
mutate_only_covered_lines = true
